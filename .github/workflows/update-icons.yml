name: Update icons

on:
  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check for a new Lucide release
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current=$(grep -oE '"[^"]+"' lib/lucide-rails/lucide_version.rb | tr -d '"')
        latest=$(gh api repos/lucide-icons/lucide/releases/latest --jq .tag_name)
        echo "current=$current latest=$latest"
        if [ "$current" = "$latest" ]; then
          echo "outdated=false" >> "$GITHUB_OUTPUT"
        else
          echo "outdated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Ruby
      if: steps.check.outputs.outdated == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Fetch icons
      if: steps.check.outputs.outdated == 'true'
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        bundle exec bin/fetch-icons --bump-patch-version

    - name: Run rspec
      if: steps.check.outputs.outdated == 'true'
      run: bundle exec rspec

    - name: Push to master
      if: steps.check.outputs.outdated == 'true'
      run: git push origin HEAD:master
